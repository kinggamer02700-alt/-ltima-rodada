name: Build Última Rodada APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: |
          unzip -q UltimaRodada-Android-Studio-com-banner.zip -d source
          test -f source/UltimaRodada-Android/settings.gradle

      - name: Gerar APK
        run: gradle -p source/UltimaRodada-Android assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultima-Rodada-APK
          path: source/UltimaRodada-Android/app/build/outputs/apk/debug/app-debug.apk
